[pytest]
testpaths = tests
pythonpath = .
markers =
    smoke: быстрая проверка доступности страницы
    regression: проверки правил формы бронирования
    security: проверки безопасности пользовательского ввода
addopts = -ra --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output artifacts/browser --junitxml artifacts/junit.xml

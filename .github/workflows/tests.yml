name: QA tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: docker compose run --build --rm tests
      - name: Write results to job summary
        if: always()
        run: |
          {
            echo "## Результат"
            echo "- Runner: ${{ runner.label }}"
            echo "- Playwright: $(python3 -m playwright --version)"
            echo "- Chromium: $(python3 -c 'from playwright.sync_api import sync_playwright as p; print(p.chromium.version)')"
            python3 - <<'PY'
            import xml.etree.ElementTree as ET
            root = ET.parse("artifacts/junit.xml").getroot()
            print(f"- Тестов: {root.get('tests')}, провалов: {root.get('failures')}, ошибок: {root.get('errors')}, пропущено: {root.get('skipped')}")
            for tc in root.iter("testcase"):
                skipped = tc.find("skipped")
                status = "xfailed" if skipped is not None and skipped.get("message") else ("skipped" if skipped is not None else "passed")
                print(f"  - {tc.get('name')}: {status}")
            PY
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
